# shared/pyproject.toml
[project]
name = "advisor-shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "azure-core[aio]>=1.30,<2",
    "azure-identity>=1.19,<2",
    "pyjwt[crypto]>=2.10,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor_shared"]
