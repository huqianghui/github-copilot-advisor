# agent/tests/eval_cases.yaml
# 行为断言:expected_stage = 事件里的瀑布终点;expect_mention = 是否应 @人
# 语言断言:reply_language = zh/en(检查回复主要语言)
cases:
  - id: quality-trusted-sufficient
    text: 'VS Code 中 GitHub Copilot 报 "Invalid string length",怎么处理?'
    expected_stage_in: [web]
    reply_language: zh
    expect_concise_answer: true
    expected_web_scopes: [trusted, general]
    max_web_requests: 2
    expect_source_urls: ["https://github.com/microsoft/vscode/issues/292795"]
    # Synthetic evidence for routing/style evaluation, not an issue transcript.
    search_fixture:
      trusted:
        - title: "GitHub Copilot Invalid string length"
          content: "Copilot 聊天在历史过长或包含大型图片附件时可能出现 Invalid string length。建议移除图片附件,新建聊天,回退上一条消息再重试。报告仍在调查,未确认所有情况的根因,也未承诺修复版本。"
          url: "https://github.com/microsoft/vscode/issues/292795"
      general:
        - title: "Additional context"
          content: "Copilot supports code completion. This overview has no troubleshooting details."
          url: "https://example.com/help"
  - id: quality-trusted-insufficient
    text: 'VS Code 中 GitHub Copilot 报 "Invalid string length",怎么处理?'
    expected_stage_in: [web]
    reply_language: zh
    expect_concise_answer: true
    expected_web_scopes: [trusted, general]
    max_web_requests: 2
    expect_source_urls: ["https://example.com/copilot-chat-length"]
    search_fixture:
      trusted:
        - title: "GitHub Copilot overview"
          content: "Copilot supports code completion. This page has no information about chat errors or Invalid string length."
          url: "https://docs.github.com/en/copilot"
      general:
        - title: "GitHub Copilot chat: Invalid string length"
          content: "用户经验:Copilot 聊天历史过长、附带大图时出现 Invalid string length。新建会话、移除附件、回退上一条消息重试后缓解。并非官方结论,原因未经确认。"
          url: "https://example.com/copilot-chat-length"
  # P0 主题1:Credits/Token/计费/上下文治理
  - id: billing-premium-requests
    text: "Copilot 的 AI Credit 是怎么计费的?我们团队额度用超了"
    expected_stage_in: [kb_hit, live_hit, web]
    reply_language: zh
  - id: billing-escalate-quota
    text: "我们想调整组织的 Copilot 配额和合同,找谁?"
    expected_stage_in: [escalated]
    expect_mention: true
    reply_language: zh
  # P0 主题2:稳定性/超时/登录/网络
  - id: stability-login-loop
    text: "VS Code 里 Copilot 一直让我重新登录,登录完又掉,怎么办?"
    expected_stage_in: [kb_hit, live_hit, web, generic_advice]
    reply_language: zh
  - id: stability-followup-escalate
    multi_turn:
      - "Copilot 在公司网络下一直 timeout"
      - "都试过了还是不行,帮我找个人吧"
    expected_stage_in: [escalated]
    expect_mention: true
    reply_language: zh
  # P0 主题3:Agent/Subagent/模型路由
  - id: agent-model-routing
    text: "Copilot 的 agent mode 怎么选模型?能固定用某个模型吗?"
    expected_stage_in: [kb_hit, live_hit, web]
    reply_language: zh
  - id: agent-english-question
    text: "How do subagents work in Copilot agent mode?"
    expected_stage_in: [kb_hit, live_hit, web]
    reply_language: en
  # P1:IDE/插件/Remote 兼容性
  - id: ide-intellij-version
    text: "IntelliJ 里 Copilot 插件和 IDE 版本不兼容,提示要升级"
    expected_stage_in: [kb_hit, live_hit, web, generic_advice]
    reply_language: zh
  - id: ide-webstorm-compat
    text: "WebStorm 2024.1 能装最新的 Copilot 插件吗?"
    expected_stage_in: [kb_hit, live_hit, web]
    reply_language: zh
  # P1:MCP 集成与密钥管理
  - id: mcp-config
    text: "Copilot 里怎么配置 MCP server?密钥放哪里安全?"
    expected_stage_in: [kb_hit, live_hit, web]
    reply_language: zh
  # 新工具:网络诊断
  - id: network-auth-error
    text: "全组今天 Copilot 都报 Authorization error 让重新登录,是不是账号出问题了?"
    expected_stage_in: [kb_hit, live_hit, web, generic_advice]
    expect_tool_called: network_diagnostics
    reply_language: zh
  # 新工具:用量查询(未配置 token 的 channel → 指引)
  # 两条用例覆盖两条不同的路径,不要合并成一条:
  # 下面这条用当前术语提问,断言"问实际数字 → 调工具"这条基本路径通;
  # 再下面那条用已退役的旧词提问,断言 prompt 规则 8 的旧词映射生效 ——
  # 只留新词等于把这次迁移最容易回归的地方(用户仍在说 premium requests)
  # 变成没有测试的区域。
  - id: usage-credits-numbers
    text: "帮我看下我们组织这个月 AI credits 用了多少?"
    expected_stage_in: [kb_hit, live_hit, web, generic_advice]
    expect_tool_called: copilot_usage_lookup
    reply_language: zh
  # 旧词提问:premium requests 已于 2026-06-01 退役,但用户会照旧这么问。
  # 期望模型把它映射到 credits_usage 去查,而不是当成一个查不到的概念。
  - id: usage-credits-legacy-term
    text: "帮我看下我们组织这个月 premium requests 用了多少?"
    expected_stage_in: [kb_hit, live_hit, web, generic_advice]
    expect_tool_called: copilot_usage_lookup
    reply_language: zh
  # 图片输入(2026-09-04):断言模型真实读出图中文本并接入检索瀑布
  - id: image-auth-error-screenshot
    text: "这是什么问题?怎么解决"
    images: [fixtures/error_screenshot.png]
    expected_stage_in: [kb_hit, live_hit, web, generic_advice]
    expect_answer_contains_any: ["认证", "登录", "Authentication", "网络"]
    reply_language: zh
  # 刻意不设 reply_language:纯图片消息没有"提问语言",而设计决策 9 的
  # "回答语言跟随提问语言"在此无定义。截图又是英文 settings.json,
  # 模型没有理由用中文答 —— 断言任一语言都是在断言一个未定义的属性。
  # (原先此处还列了 is_mostly_chinese 对 latin 敏感这条理由,该缺陷已于
  #  2026-09-05 修复 —— 现在比较的是语素而非字符。但上面那条理由独立成立。)
  - id: image-config-screenshot-no-text
    text: ""
    images: [fixtures/config_screenshot.png]
    expected_stage_in: [kb_hit, live_hit, web, generic_advice]
    expect_answer_contains_any: ["github.copilot.enable", "配置", "settings"]
