[project]
name = "advisor-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "advisor-shared",
    "agent-framework-core>=1.0.0",
    "openai>=1.40",
    "azure-search-documents>=11.5.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor_agent"]
