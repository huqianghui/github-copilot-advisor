# pyproject.toml(仓库根)
[project]
name = "github-copilot-advisor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["shared", "ingestion", "agent", "channels/teams"]

[tool.uv.sources]
advisor-shared = { workspace = true }
advisor-agent = { workspace = true }

# Corporate PyPI mirror (Azure DevOps artifacts feed). Public PyPI's download
# CDN (files.pythonhosted.org) is unreachable in this environment; pip already
# routes through this feed via its global config. uv does not read pip config,
# so declare it here as the default index for reproducible resolves.
[[tool.uv.index]]
name = "corp"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "ingestion/tests", "agent/tests",
             "channels/teams/tests"]
asyncio_mode = "auto"
markers = ["integration: requires real Azure/GitHub resources"]
addopts = "-m 'not integration'"
