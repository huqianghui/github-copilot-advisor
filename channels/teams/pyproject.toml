[project]
name = "advisor-teams"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "advisor-agent",
    "advisor-shared",
    "botbuilder-core>=4.16",
    "aiohttp>=3.9",
    "botbuilder-integration-aiohttp==4.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_adapter"]

[[tool.uv.index]]
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true
