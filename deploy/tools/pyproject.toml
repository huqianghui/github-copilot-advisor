[project]
name = "advisor-deploy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "advisor-shared",
    "httpx>=0.27",
    "azure-identity>=1.19,<2",
    "python-dotenv>=1.0,<2",
    "aiohttp>=3.9,<4",
    "azure-storage-blob>=12.24,<13",
]

[project.scripts]
advisor-deploy = "advisor_deploy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor_deploy"]
