services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --inMemoryPersistence
      - --skipApiVersionCheck
      - --disableTelemetry
      - --silent
    ports:
      - "127.0.0.1:11000:10000"
      - "127.0.0.1:11001:10001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:10000/devstoreaccount1?comp=list', r => { r.resume(); process.exit(r.statusCode < 500 ? 0 : 1); }).on('error', () => process.exit(1)); setTimeout(() => process.exit(1), 2000);"
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
