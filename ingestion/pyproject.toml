# ingestion/pyproject.toml
[project]
name = "advisor-ingestion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "advisor-shared",
    "httpx>=0.27",
    "azure-search-documents>=11.5.1",
    "openai>=1.40",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
